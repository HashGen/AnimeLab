name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source files
        run: pnpm exec prettier --write AGENTS.md CONTEXT.md README.md index.html package.json src/main.tsx src/app/styles.css src/features/studio/components/AudioMouthControls.tsx src/features/studio/components/StudioIdentity.tsx src/features/studio/components/StudioInspector.tsx src/features/studio/components/StudioStage.tsx src/features/studio/components/StudioView.tsx src/i18n/index.ts src/i18n/zh.ts

      - name: Validate project
        run: pnpm check
