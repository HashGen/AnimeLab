name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source files
        run: pnpm exec prettier --write AGENTS.md CONTEXT.md README.md index.html package.json src/main.tsx src/app/styles.css src/features/studio/components/AudioMouthControls.tsx packages/avatar-core/src/geometry.ts src/features/rendering/components/AvatarCanvas.tsx src/features/studio/components/StudioIdentity.tsx src/features/studio/components/StudioInspector.tsx src/features/studio/components/StudioStage.tsx src/features/studio/components/StudioTimeline.tsx src/features/studio/components/StudioView.tsx src/features/studio/components/StudioProductionWorkspace.tsx src/features/studio/__tests__/studio-document-test.ts src/i18n/index.ts src/i18n/zh.ts

      - name: Validate project
        run: pnpm check

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'chore(release): publish runtime packages'
          commit: 'chore(release): publish runtime packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
